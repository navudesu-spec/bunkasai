layout: null
---
<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Bunkasai</title>
  <!-- ① スクリプトの読み込み -->
<script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
<script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.2/aframe/build/aframe-ar.js"></script>

</head>
<body style='margin: 0; overflow: hidden;'>

<!-- シーンの追加とデバックUIを非表示 -->
 <a-scene embedded arjs="sourceType: webcam; debugUIEnabled:false;">
<a-assets><a-asset-item id="bouningen" src="AR/models/yarakasita.glb"></a-asset-item></a-assets>
  <!-- ② hiroマーカーでのソース -->

    <a-marker preset="hiro">
        <!-- 3Dモデルを呼び出す -->
        <a-entity gltf-model="#bouningen" rotation="90 180 0"></a-entity>
        <a-sphere scale=".25 .25 .25" position="0 .10 0" color="#00f">
        </a-sphere></a-marker>

 
<a-marker type="pattern" url="AR/gazou/pattern-IMG_3680.patt">
    <a-sphere scale=".25 .25 .25" position="0 .5 0" color="#f00">
      <a-animation attribute="position" to="0 1 0" direction="alternate" dur="2000" repeat="indefinite">
      </a-animation>
    </a-sphere>
  </a-marker>
 <a-scene renderer="colorManagement: true;"></a-scene>
  
  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
