
<!DOCTYPE html>
<head>
  <!-- ① スクリプトの読み込み -->
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.2/aframe/build/aframe-ar.js"></script>
</head>
<body style='margin: 0; overflow: hidden;'>

<!-- シーンの追加とデバックUIを非表示 -->
<a-scene embedded arjs="debugUIEnabled:false;">

  <!-- ② hiroマーカーでのソース -->
  <a-marker preset="hiro">
    <a-sphere scale=".25 .25 .25" position="0 .5 0" color="#111">
      <a-animation attribute="position" to="0 1 0" direction="alternate" dur="2000" repeat="indefinite">
      </a-animation>
    </a-sphere>
    <a-box position="-1 1.6 -5" color="#444">
  <a-animation property="rotation" to="0 360 0" loop="true" dur="1000" easing="linear">
    </a-animation></a-box>
  <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"
            animation="property: position; to: 1 1.5 -3; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
 </a-cylinder>

  </a-marker>

  
  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
